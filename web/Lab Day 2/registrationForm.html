<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body>
    <h1 style="text-align: center; color: #007bff;">Student Registration Form</h1>
    <div style="background-color: grey; padding: 20px; border-radius: 10px; width: 400px; margin: 0 auto;" action="submit.php" method="post">
    <form>
        <label>Student Name:</label>
        <input type="text" name="name" placeholder="Enter your name" required><br><br>
        <label>Age:</label>
        <input type="number" name="age" placeholder="Enter your age" required><br><br>
        <label>Email Address:</label>
        <input type="email" name="email" placeholder="Enter your email" required><br><br>
        <label>Password:</label>
        <input type="password" name="password" placeholder="Enter your password" required><br><br>
        <label>Gender:</label>
        <input type="radio" name="gender" value="male" required> Male
        <input type="radio" name="gender" value="female" required> Female<br><br>
        <label>Course:</label>
        <select name="course" required>
            <option value="Information Technology">Information Technology</option>
            <option value="Computer Science">Computer Science</option>
            <option value="Data Science">Data Science</option>
            <option value="Software Engineering">Software Engineering</option>
        </select><br><br>
        <label>Skills</label></form><br>
        <input type="checkbox" name="skills" value="HTML"> HTML<br>
        <input type="checkbox" name="skills" value="CSS"> CSS<br>
        <input type="checkbox" name="skills" value="JavaScript"> JavaScript<br>
        <input type="checkbox" name="skills" value="Python"> Python<br><br>
        <label>Address:</label>
        <textarea name="address" placeholder="Enter your address" required></textarea><br><br>
        <input type="submit" value="Submit" style="background-color: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer;">
        <input type="reset" value="Reset" style="background-color: #dc3545; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer;">
    </form>
    </div>

</body>
</html>
