<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Hospital Patient Registration</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f6f8;
            margin: 30px;
        }

        fieldset {
            width: 550px;
            margin: auto;
            padding: 20px;
            background-color: white;
            border: 2px solid #3498db;
            border-radius: 8px;
        }

        legend {
            font-size: 22px;
            font-weight: bold;
            color: #2471a3;
        }

        .form-row {
            margin-bottom: 15px;
        }

        .form-row label {
            display: inline-block;
            width: 130px;
            vertical-align: top;
        }

        input, select, textarea {
            padding: 6px;
        }

        textarea {
            width: 250px;
            height: 70px;
        }

        button {
            padding: 8px 20px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #21618c;
        }

        #patientOutput {
            width: 550px;
            margin: 20px auto;
            padding: 20px;
            background-color: white;
            border: 1px solid #3498db;
            box-sizing: border-box;
            overflow-wrap: anywhere;
        }

        #patientOutput:empty {
            display: none;
        }
    </style>
</head>

<body>

    <form id="registrationForm" onsubmit="return false;">

        <fieldset>

            <legend>Patient Information</legend>

            <div class="form-row">
                <label for="fullName">Name:</label>
                <input type="text" id="fullName">
            </div>

            <div class="form-row">
                <label for="homeAddress">Address:</label>
                <textarea id="homeAddress"></textarea>
            </div>

            <div class="form-row">
                <label for="dob">Birth Date:</label>
                <input type="date" id="dob">
            </div>

            <div class="form-row">
                <label for="patientAge">Age:</label>
                <input type="number" id="patientAge" min="0" max="130">
            </div>

            <div class="form-row">
                <label>Gender:</label>

                <input type="radio" name="sex" id="maleOption" value="Male">
                <label for="maleOption" style="width:auto;">Male</label>

                <input type="radio" name="sex" id="femaleOption" value="Female">
                <label for="femaleOption" style="width:auto;">Female</label>
            </div>

            <div class="form-row">
                <label for="illness">Disease:</label>

                <select id="illness">
                    <option value="">Select</option>
                    <option value="Fever">Fever</option>
                    <option value="Diabetes">Diabetes</option>
                    <option value="Asthma">Asthma</option>
                    <option value="Heart Disease">Heart Disease</option>
                </select>
            </div>

            <div class="form-row">
                <label for="mailAddress">E-mail:</label>
                <input type="email" id="mailAddress">
            </div>

            <div class="form-row">
                <label for="securityPin">PIN:</label>
                <input type="password" id="securityPin">
            </div>

            <button type="button" onclick="registerPatient()">
                Submit
            </button>

        </fieldset>

    </form>

    <div id="patientOutput"></div>

    <script>

        function registerPatient() {

            let patientName = document.getElementById("fullName").value.trim();
            let patientAddress = document.getElementById("homeAddress").value.trim();
            let dateOfBirth = document.getElementById("dob").value;
            let ageValue = document.getElementById("patientAge").value;
            let selectedDisease = document.getElementById("illness").value;
            let patientEmail = document.getElementById("mailAddress").value.trim();
            let patientPin = document.getElementById("securityPin").value;

            let genderChoice = document.querySelector(
                'input[name="sex"]:checked'
            );

            // Check whether all fields are completed
            if (
                patientName === "" ||
                patientAddress === "" ||
                dateOfBirth === "" ||
                ageValue === "" ||
                selectedDisease === "" ||
                patientEmail === "" ||
                patientPin === "" ||
                genderChoice === null
            ) {
                alert("Please complete all the fields before submitting.");
                return;
            }

            // Validate age
            let ageNumber = Number(ageValue);

            if (!Number.isInteger(ageNumber) || ageNumber < 0 || ageNumber > 130) {
                alert("Please enter a valid age.");
                return;
            }

            // Validate birth date
            if (dateOfBirth > new Date().toISOString().split("T")[0]) {
                alert("Birth date cannot be in the future.");
                return;
            }

            // Validate email format
            let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (!emailPattern.test(patientEmail)) {
                alert("Please enter a valid email address.");
                return;
            }

            alert("Patient registered successfully!");

            // Display the submitted information
            let outputBox = document.getElementById("patientOutput");

            outputBox.replaceChildren();

            let heading = document.createElement("h2");
            heading.textContent = "Registered Patient Details";
            outputBox.appendChild(heading);

            let patientDetails = [
                ["Name", patientName],
                ["Address", patientAddress],
                ["Birth Date", dateOfBirth],
                ["Age", ageNumber],
                ["Gender", genderChoice.value],
                ["Disease", selectedDisease],
                ["E-mail", patientEmail]
            ];

            patientDetails.forEach(function (detail) {

                let paragraph = document.createElement("p");
                let label = document.createElement("strong");

                label.textContent = detail[0] + ": ";
                paragraph.appendChild(label);
                paragraph.appendChild(
                    document.createTextNode(detail[1])
                );

                outputBox.appendChild(paragraph);

            });

            // Never display the PIN in the results
        }

    </script>

</body>
</html>
